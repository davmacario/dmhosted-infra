services:
  blog:
    image: ghcr.io/davmacario/dmhosted-blog:v1.3.0
    container_name: dmhosted-blog
    hostname: dmhosted-blog
    networks:
      - dmhosted-blog
    restart: unless-stopped
    healthcheck:
      start_period: 1m
      interval: 20s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
    user: "1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 32m
    cpus: 0.05

  whoami:
    image: traefik/whoami
    container_name: whoami
    hostname: whoami
    networks:
      - dmhosted-blog
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.03

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: cloudflared
    env_file: .env
    entrypoint:
      - cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - --config
      - /etc/cloudflared/config/config.yaml
      - run
    volumes:
      - "./cloudflared-config.yaml:/etc/cloudflared/config/config.yaml"
    ports: # NOTE: ensure that the node is not publicly accessible
      - "2000:2000"
    networks:
      - dmhosted-blog
    depends_on:
      blog:
        condition: service_healthy
      whoami:
        condition: service_started

networks:
  dmhosted-blog:
