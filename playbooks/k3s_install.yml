---
- name: Pre tasks
  hosts: k3s_cluster
  pre_tasks:
    - name: Verify Ansible is version 2.11 or above. (If this fails you may need to update Ansible)
      ansible.builtin.assert:
        that: ansible_version.full is version_compare('2.11', '>=')
        msg: >
          "Ansible is out of date. Need version >=2.11"
    - name: Verify all cluster nodes have unique hostnames
      ansible.builtin.assert:
        that: (cluster_hostnames | unique | length) == (cluster_hostnames | length)
        msg: >-
          k3s nodes must have unique hostnames. Found a duplicate in:
          {{ cluster_hostnames | unique }}. Each node registers in the cluster
          keyed by its hostname, so matching hostnames prevent nodes from joining.
      vars:
        cluster_hostnames: >-
          {{
            groups['k3s_cluster']
            | map('extract', hostvars, 'ansible_hostname')
            | list
          }}
      run_once: true
      when: "'k3s_cluster' in groups"

- name: Prepare k3s nodes
  hosts: k3s_cluster
  gather_facts: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: techno_tim.k3s_ansible.prereq
      become: true
    # This is just for raspberry pi's
    # - role: techno_tim.k3s_ansible.raspberrypi
    #   become: true
    - role: techno_tim.k3s_ansible.download
      become: true

- name: Setup k3s servers
  hosts: k3s_master
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: techno_tim.k3s_ansible.k3s_server
      become: true

- name: Setup k3s agents
  hosts: k3s_worker
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: techno_tim.k3s_ansible.k3s_agent
      become: true

- name: Configure k3s cluster
  hosts: k3s_master
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: techno_tim.k3s_ansible.k3s_server_post
      become: true

- name: Storing kubeconfig in the playbook directory
  hosts: k3s_master
  environment: "{{ proxy_env | default({}) }}"
  tasks:
    - name: Copying kubeconfig from {{ hostvars[groups[group_name_master | default('master')][0]]['ansible_hostname'] }}
      ansible.builtin.fetch:
        src: "{{ ansible_user_dir }}/.kube/config"
        dest: ~/.kube/config.new
        flat: true
      when: ansible_facts['hostname'] == hostvars[groups[group_name_master | default('master')][0]]['ansible_hostname']

# Bootstrap ArgoCD, which will then install everything else (incl. kube-vip,
# MetalLB)
# Skipped if Argo CD is already installed.
- name: Bootstrap GitOps (Argo CD + root app)
  hosts: "{{ group_name_master | default('master') }}[0]"
  become: true
  environment: "{{ proxy_env | default({}) }}"
  tags: gitops
  vars:
    repo_root: "{{ playbook_dir }}/.."
    # Single source of truth for the Argo CD version: the kustomization Argo CD manages itself with
    argocd_version: >-
      {{ lookup('ansible.builtin.file', repo_root + '/kubernetes/apps/argocd/kustomization.yaml')
         | regex_search('argo-cd/(v[0-9.]+)/manifests/install.yaml', '\1') | first }}
    argocd_repo_url: https://github.com/davmacario/dmhosted-infra
  tasks:
    - name: Verify repository credentials are defined
      ansible.builtin.assert:
        that:
          - argocd_repo_username is defined
          - argocd_repo_password is defined
        msg: >-
          Define the vault-encrypted `argocd_repo_username` and `argocd_repo_password`
          (GitHub token with read access to {{ argocd_repo_url }}) in inventory/group_vars/k3s_cluster.yml

    - name: Check whether Argo CD is already installed
      ansible.builtin.command: k3s kubectl get namespace argocd
      register: argocd_ns
      changed_when: false
      failed_when: false

    - name: Install Argo CD
      when: argocd_ns.rc != 0
      block:
        # NOTE: use if restoring from existing cluster
        # To do so, define the **sensitive** variable
        # `sealed_secrets_key_manifest` (vault-encrypt it) obtained from:
        #      `kubectl -n kube-system get secret -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml`
        # If the variable is not defined, this step is skipped
        - name: Restore the Sealed Secrets key (so existing SealedSecrets can be decrypted)
          ansible.builtin.command:
            cmd: k3s kubectl apply -f -
            stdin: "{{ sealed_secrets_key_manifest }}"
          when: sealed_secrets_key_manifest is defined
          no_log: true

        - name: Create argocd namespace
          ansible.builtin.command: k3s kubectl create namespace argocd

        - name: Apply Argo CD {{ argocd_version }} manifests
          ansible.builtin.command: >-
            k3s kubectl apply -n argocd --server-side --force-conflicts
            -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml

        - name: Wait for Argo CD to be ready
          ansible.builtin.command: k3s kubectl -n argocd rollout status {{ item }} --timeout=300s
          loop:
            - deployment/argocd-repo-server
            - deployment/argocd-server
            - statefulset/argocd-application-controller
          changed_when: false

        # Replaced by the SealedSecret in kubernetes/apps/argocd once sealed-secrets is running
        - name: Create repository credentials
          ansible.builtin.command:
            cmd: k3s kubectl apply -f -
            stdin: "{{ repo_secret | to_nice_yaml }}"
          vars:
            repo_secret:
              apiVersion: v1
              kind: Secret
              metadata:
                name: github-repo-credentials
                namespace: argocd
                labels:
                  argocd.argoproj.io/secret-type: repository
                annotations:
                  # Lets the SealedSecret take over this hand-created Secret
                  sealedsecrets.bitnami.com/managed: "true"
              stringData:
                type: git
                url: "{{ argocd_repo_url }}"
                username: "{{ argocd_repo_username }}"
                password: "{{ argocd_repo_password }}"
          no_log: true

        - name: Apply root app
          ansible.builtin.command:
            cmd: k3s kubectl apply -f -
            stdin: "{{ lookup('ansible.builtin.file', repo_root + '/kubernetes/root-app.yaml') }}"

# The k3s_server role deploys kube-vip (and MetalLB, when enabled) through the
# K3s auto-deploy manifests directory, which K3s re-applies on every restart and
# whenever the objects are deleted. Argo CD owns these components, so disable
# the manifests with a `.skip` marker. Objects already running are kept (kube-vip
# still serves the API VIP).
- name: Hand off kube-vip and MetalLB to Argo CD
  hosts: k3s_master
  become: true
  tags: handoff
  vars:
    k3s_manifests_dir: /var/lib/rancher/k3s/server/manifests
    k3s_handoff_manifests:
      - vip.yaml
      - vip-rbac.yaml
      - metallb-crds.yaml
  tasks:
    # Created even if the manifest is absent: the k3s_server role rewrites it on
    # the next run, and the marker keeps K3s from applying it until the role's
    # cleanup removes both
    - name: Stop K3s from re-applying them
      ansible.builtin.copy:
        content: ""
        dest: "{{ k3s_manifests_dir }}/{{ item }}.skip"
        mode: "0644"
        force: false
      loop: "{{ k3s_handoff_manifests }}"

    - name: Remove problematic files
      ansible.builtin.file:
        state: absent
        path: "{{ k3s_manifests_dir }}/{{ item }}"
      loop: "{{ k3s_handoff_manifests }}"
