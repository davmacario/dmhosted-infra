apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoscale-blog
  namespace: dmhosted-blog
spec:
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # Scale up when CPU goes above 80% utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dmhosted-blog
  behavior:
    scaleUp:
      # Allow up to 5 pods to be created over 30s
      policies:
        - type: Pods
          periodSeconds: 30
          value: 5
    # Allow deleting up to 50% of pods over 30s
    scaleDown:
      policies:
        - type: Percent
          periodSeconds: 30
          value: 50
