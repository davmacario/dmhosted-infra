apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmhosted-blog
  namespace: dmhosted-blog
  labels:
    app: dmhosted-blog
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dmhosted-blog
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: dmhosted-blog
      labels:
        app: dmhosted-blog
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dmhosted-blog
      containers:
        - name: dmhosted-blog
          image: ghcr.io/davmacario/dmhosted-blog:20260824-6e82adc
          ports:
            - name: http
              containerPort: 8080
          # /healthz is served by the Caddyfile baked into the image
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # /usr/bin/caddy carries cap_net_bind_service as a file capability
              # exec fails with EPERM unless it stays in the bounding set, even
              # though the server only binds :8080
              add:
                - NET_BIND_SERVICE
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 24Mi
          volumeMounts:
            # image points XDG_{CONFIG,DATA}_HOME at /tmp/caddy-*
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
