---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.internal.dmhosted.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.internal.dmhosted.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-server-internal-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-internal
  namespace: argocd
spec:
  secretName: argocd-server-internal-cert
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - argocd.internal.dmhosted.com
