apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stirling-pdf-ingressroute-certificate
  namespace: stirling-pdf
spec:
  secretName: stirling-pdf-certificate-secret-internal
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - stirling-pdf.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stirling-pdf-ingressroute-tailscale
  namespace: stirling-pdf
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - match: Host(`stirling-pdf.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: stirling-pdf
          port: 8080
  tls:
    secretName: stirling-pdf-certificate-secret-internal
