---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-ingressroute-internal
  namespace: homepage
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`homepage.internal.dmhosted.com`)
      services:
        - kind: Service
          name: homepage
          port: 3000
          sticky:
            cookie:
              httpOnly: true
              secure: true
              sameSite: none
  tls:
    secretName: homepage-cert-internal
