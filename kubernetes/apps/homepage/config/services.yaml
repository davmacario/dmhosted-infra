- Homelab:
    - Proxmox:
        icon: proxmox.svg
        href: "https://pve-dmacario.taila7b4c.ts.net:8006"
        description: PVE-dmacario
        widget:
          type: proxmox
          url: "https://pve-dmacario.taila7b4c.ts.net:8006"
          username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
          node: pve-dmacario

    - TrueNAS:
        icon: truenas.svg
        href: "https://nas.internal.dmhosted.com"
        widget:
          type: truenas
          url: http://192.168.178.254
          version: 2
          key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
          enablePools: true
          nasType: scale

    - ArgoCD:
        icon: argo-cd.svg
        href: https://argocd.internal.dmhosted.com
        widget:
          type: argocd
          url: https://argocd.internal.dmhosted.com/
          key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"
          fields: ["apps", "synced", "outOfSync", "healthy"]

    - Longhorn:
        icon: sh-rancher-longhorn.svg
        href: https://longhorn.internal.dmhosted.com/


- Apps:
    - DMHosted Blog:
        icon: hugo.svg
        href: https://blog.dmhosted.com/
        description: My personal blog!
        siteMonitor: https://blog.dmhosted.com/healthz
    - Forgejo:
        icon: forgejo.svg
        href: https://forgejo.dmhosted.com/
        description: Git Hosting
        siteMonitor: https://forgejo.dmhosted.com/api/healthz
        widget:
          type: gitea
          url: http://forgejo-http.forgejo.svc.cluster.local:3000/
          key: "{{HOMEPAGE_VAR_FORGEJO_KEY}}"
    - Nextcloud:
        icon: sh-nextcloud.svg
        href: https://nextcloud.beta2home.duckdns.org/
