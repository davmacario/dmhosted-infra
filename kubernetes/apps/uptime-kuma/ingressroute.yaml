apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uptime-kuma-ingressroute-certificate
  namespace: uptime-kuma
spec:
  secretName: uptime-kuma-certificate-secret-internal
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - uptime-kuma.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-ingressroute-tailscale
  namespace: uptime-kuma
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - match: Host(`uptime-kuma.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    secretName: uptime-kuma-certificate-secret-internal
