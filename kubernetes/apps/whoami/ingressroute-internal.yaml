# testing only - will be exposed externally
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: whoami-internal-cert
  namespace: whoami
spec:
  secretName: whoami-internal-cert
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - whoami.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-ingressroute-internal
  namespace: whoami
  annotations:
    kubernetes.io/ingress.class: traefik-tailscale
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`whoami.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: whoami
          port: 80
  tls:
    secretName: whoami-internal-cert
