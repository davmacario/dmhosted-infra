apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoscale-vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaultwarden
  behavior:
    scaleUp:
      policies:
        - type: Pods
          periodSeconds: 30
          value: 5
    scaleDown:
      policies:
        - type: Percent
          periodSeconds: 30
          value: 50
