# Values for Helm installation of Vaultwarden

replicas: 1

image:
  tag: "1.37.3-alpine"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# Defaults, but good to track
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

storage:
  existingVolumeClaim:
    claimName: "vaultwarden-rwx-pvc"
    dataPath: "/data"

database:
  type: "postgresql"
  host: "vaultwarden-db-rw"
  port: 5432
  dbName: "vaultwarden"
  existingSecret: "vaultwarden-app-db-secret"
  existingSecretUserKey: username
  existingSecretPasswordKey: password

domain: "https://vaultwarden.dmhosted.com"

adminToken:
  existingSecret: "vaultwarden-admin-token"
  existingSecretKey: "admin-token"

timeZone: "Europe/Amsterdam"

service:
  type: "ClusterIP"
  annotations: {}
  labels:
    app: vaultwarden
  sessionAffinity: "ClientIP"
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

ingress:
  enabled: false

# Others
signupsAllowed: false
signupsVerify: "true"
invitationsAllowed: true
invitationOrgName: "DMHosted's Vaultwarden"
invitationExpirationHours: "24"
# Nobody can create new organizations from the web vault.
orgCreationUsers: "none"
# Mail the user whenever a new device logs in.
requireDeviceEmail: "true"
# Explicit (already the default): never render a password hint unauthenticated.
showPassHint: "false"
# Audit log for organization activity. `eventsDayRetain` is also what enables
# the `eventCleanupSched` job - without it events are kept forever.
orgEventsEnabled: "true"
eventsDayRetain: "90"

# Requests arrive through the Cloudflare tunnel, so Traefik's `X-Real-IP` (the
# chart default) is always the cloudflared pod's address
ipHeader: "CF-Connecting-IP"

smtp:
  existingSecret: vaultwarden-smtp
  port: 587
  security: starttls
  from: vaultwarden@dmhosted.com
  fromName: Vaultwarden
  host: smtp-relay.brevo.com
  username:
    existingSecretKey: username
  password:
    existingSecretKey: password
  authMechanism: "Plain"
  acceptInvalidHostnames: "false"
  acceptInvalidCerts: "false"
  debug: false

# Security hardening
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Avoids issues with readOnlyRootFilesystem
extraVolumes:
  - name: tmp
    emptyDir:
      medium: Memory
      sizeLimit: 64Mi
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

# Don't inject every Service's host/port into the container's environment.
enableServiceLinks: false
