apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-internal-cert
  namespace: vaultwarden
spec:
  secretName: vaultwarden-internal-cert
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - vaultwarden.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-internal
  namespace: vaultwarden
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - match: Host(`vaultwarden.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
  tls:
    secretName: vaultwarden-internal-cert
