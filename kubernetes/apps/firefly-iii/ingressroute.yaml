apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: firefly-iii-internal-cert
  namespace: firefly-iii
  labels:
    app: firefly-iii
spec:
  secretName: firefly-iii-internal-cert
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - firefly-iii.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-iii-internal
  namespace: firefly-iii
  labels:
    app: firefly-iii
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - match: Host(`firefly-iii.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: firefly-iii
          port: 8080
  tls:
    secretName: firefly-iii-internal-cert
