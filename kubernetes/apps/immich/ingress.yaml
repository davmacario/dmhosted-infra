apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-internal-cert
  namespace: immich
  labels:
    app: immich
spec:
  secretName: immich-internal-cert
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - immich.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-internal
  namespace: immich
  labels:
    app: immich
  annotations:
    kubernetes.io/ingress.class: traefik-tailscale
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`immich.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: immich
          port: 8080
  tls:
    secretName: immich-internal-cert
