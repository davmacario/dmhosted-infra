apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-internal-cert
  namespace: immich
  labels:
    app: immich
spec:
  secretName: immich-internal-cert
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - immich.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-internal
  namespace: immich
  labels:
    app: immich
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - match: Host(`immich.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: immich-server
          port: http
  tls:
    secretName: immich-internal-cert
