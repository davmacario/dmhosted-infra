apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: speedtest-ingressroute-certificate
  namespace: speedtest-tracker
spec:
  secretName: speedtest-certificate-secret-internal
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - speedtest.internal.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: speedtest-tracker-ingressroute-tailscale
  namespace: speedtest-tracker
  annotations:
    kubernetes.io/ingress.class: traefik-tailscale
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`speedtest.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: speedtest-tracker
          port: 80
  tls:
    secretName: speedtest-certificate-secret-internal
