apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: speedtest-tracker-db
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker-db
spec:
  description: "Database cluster for Speedtest Tracker"
  inheritedMetadata:
    labels:
      app: speedtest-tracker-db
  imageName: ghcr.io/cloudnative-pg/postgresql:15-minimal-trixie
  imagePullPolicy: IfNotPresent
  instances: 1
  storage:
    storageClass: longhorn-singlecopy
    size: 10Gi
  bootstrap:
    initdb:
      database: speedtest_tracker
      owner: speedy
      secret:
        name: speedtest-tracker-db-credentials
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
