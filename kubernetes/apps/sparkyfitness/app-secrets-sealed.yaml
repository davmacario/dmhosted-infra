---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sparkyfitness-app-db-secret
  namespace: sparkyfitness
spec:
  encryptedData:
    db-password: 
    db-user: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: sparkyfitness-app-db-secret
      namespace: sparkyfitness
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sparkyfitness-secrets
  namespace: sparkyfitness
spec:
  encryptedData:
    sparkyfitness_api_key: 
    sparkyfitness_better_auth_secret: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: sparkyfitness-secrets
      namespace: sparkyfitness
    type: Opaque
