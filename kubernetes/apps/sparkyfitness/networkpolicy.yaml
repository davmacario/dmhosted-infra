---
# Default deny for the SparkyFitness app pods (DB pods are left to CNPG)
# NOTE: the allow policies below already imply default deny for these pods,
# this is kept as good practice (same as vaultwarden)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-sparkyfitness-app
  namespace: sparkyfitness
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - sparkyfitness-frontend
          - sparkyfitness-backend
  policyTypes:
    - Ingress
    - Egress
---
# Cluster DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-sparkyfitness-app
  namespace: sparkyfitness
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - sparkyfitness-frontend
          - sparkyfitness-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Frontend (nginx): reached by traefik-tailscale, proxies to the backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sparkyfitness-frontend
  namespace: sparkyfitness
spec:
  podSelector:
    matchLabels:
      app: sparkyfitness-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-tailscale
          podSelector:
            matchLabels: # from kubernetes/traefik-tailscale/values.yaml
              app: traefik
              instance: tailscale
      ports:
        - port: 80
          protocol: TCP
    # Allow liveness/readiness probes (kubelet, node network)
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 80
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sparkyfitness-backend
      ports:
        - port: 3010
          protocol: TCP
---
# Backend: reached by the frontend only; talks to CNPG and the internet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sparkyfitness-backend
  namespace: sparkyfitness
spec:
  podSelector:
    matchLabels:
      app: sparkyfitness-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sparkyfitness-frontend
      ports:
        - port: 3010
          protocol: TCP
    # Allow liveness/readiness/startup probes (kubelet, node network)
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 3010
          protocol: TCP
  egress:
    # Database (CNPG)
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: sparkyfitness-db
      ports:
        - port: 5432
          protocol: TCP
    # Food providers (Open Food Facts, USDA, ...), AI providers, Hevy, etc.
    # over the public internet. Exclude private subnets
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
              - 100.64.0.0/10
              - 169.254.0.0/16
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
