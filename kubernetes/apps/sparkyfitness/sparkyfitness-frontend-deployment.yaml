---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkyfitness-frontend
  namespace: sparkyfitness
  labels:
    app: sparkyfitness-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sparkyfitness-frontend
  strategy: # Stateless, no PV: zero-downtime rollouts
    type: RollingUpdate
  revisionHistoryLimit: 3 # Only keep latest 3 ReplicaSets
  template:
    metadata:
      labels:
        app: sparkyfitness-frontend
    spec:
      automountServiceAccountToken: false
      securityContext: # Mirrors upstream Helm chart (nginx user in nginx:alpine)
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sparkyfitness-frontend
          image: codewithcj/sparkyfitness:v1.12.1
          env:
            - name: SPARKY_FITNESS_FRONTEND_URL
              value: https://sparkyfitness.internal.dmhosted.com
            - name: ALLOW_PRIVATE_NETWORK_CORS
              value: "false"
            - name: SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS
              value: https://sparkyfitness.local.dmhosted.com # Alt origins, csv
            - name: SPARKY_FITNESS_SERVER_HOST
              value: sparkyfitness-backend.sparkyfitness.svc.cluster.local # due to nginx
            - name: SPARKY_FITNESS_SERVER_PORT
              value: "3010"
            - name: TZ
              value: Europe/Amsterdam
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE # nginx listens on :80
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            # Writable dirs (root filesystem is read-only); entrypoint renders
            # the nginx config into conf.d at startup
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/cache/nginx
              name: nginx-cache
            - mountPath: /run
              name: nginx-run
            - mountPath: /etc/nginx/conf.d
              name: nginx-conf
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
