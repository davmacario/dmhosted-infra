---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
  labels:
    app: forgejo
spec:
  description: Database cluster for Forgejo
  inheritedMetadata:
    labels:
      app: forgejo
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  imagePullPolicy: IfNotPresent
  instances: 3
  storage:
    storageClass: longhorn-singlecopy
    size: 10Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-app-db-secret
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 1536Mi
  postgresql: # Add vector plugin
    extensions:
      - name: pgvector
        image:
          # renovate: suite=trixie-pgdg depName=postgresql-18-pgvector
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.5-18-trixie
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: rustfs-store
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo-app
spec:
  name: forgejo
  owner: forgejo
  cluster:
    name: forgejo-db
  extensions:
    - name: vector
      # renovate: suite=trixie-pgdg depName=postgresql-18-pgvector extractVersion=^(?<version>\d+\.\d+\.\d+)
      version: "0.8.5"
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: rustfs-store
  namespace: forgejo
  labels:
    app: forgejo
spec:
  configuration:
    destinationPath: s3://cnpg-backups/forgejo
    endpointURL: http://192.168.178.254:30292
    s3Credentials:
      accessKeyId:
        name: forgejo-cnpg-rustfs-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: forgejo-cnpg-rustfs-secret
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: forgejo-rustfs-backup
  namespace: forgejo
spec:
  cluster:
    name: forgejo-db
  schedule: "0 15 2 * * *" # Every day at 2:15
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
