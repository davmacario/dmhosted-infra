apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo-cert
  namespace: forgejo
spec:
  secretName: forgejo-cert
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - forgejo.dmhosted.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    external-dns.alpha.kubernetes.io/provider: cloudflare
    external-dns.alpha.kubernetes.io/hostname: forgejo.dmhosted.com
    external-dns.alpha.kubernetes.io/target: b8f93036-6de6-4d1c-a590-bdbf64f990ad.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`forgejo.dmhosted.com`)
      kind: Rule
      services:
        - name: forgejo
          port: 3000
  tls:
    secretName: forgejo-cert
