# NOTE: not needed, as the dashboard is not exposed with the main traefik
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-certificate-local
  namespace: traefik
spec:
  secretName: traefik-dashboard-certificate-secret-local
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - traefik.local.dmhosted.com
