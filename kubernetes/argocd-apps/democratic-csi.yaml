# NOTE: only deploys NFS driver from democratic-csi
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argocd
  labels:
    name: democratic-csi
spec:
  project: default
  sources:
    - repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: 0.15.1
      helm:
        # NOTE: using nfs name
        releaseName: nfs
        valueFiles:
          - $values/kubernetes/democratic-csi/nfs/values.yaml
    - repoURL: https://github.com/davmacario/dmhosted-infra
      targetRevision: main
      ref: values
    - repoURL: https://github.com/davmacario/dmhosted-infra
      targetRevision: main
      path: kubernetes/democratic-csi/nfs
      directory:
        recurse: false
        # exclude values and resources used for testing
        exclude: '{values.yaml,test-sc.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
