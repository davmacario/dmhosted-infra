apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/davmacario/dmhosted-infra
    targetRevision: main
    path: kubernetes/networking
  destination:
    server: https://kubernetes.default.svc
    namespace: networking
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
