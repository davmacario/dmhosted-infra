apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dmohsted-blog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/davmacario/dmhosted-infra
    targetRevision: main
    path: kubernetes/apps/dmhosted-blog
  destination:
    server: https://kubernetes.default.svc
    namespace: dmhosted-blog
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
