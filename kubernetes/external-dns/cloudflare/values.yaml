provider:
  name: cloudflare
policy: sync
sources:
  - service
  - ingress
  - crd
  - traefik-proxy
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-key
        key: apiKey
domainFilters:
  - dmhosted.com
txtOwnerId: "k3s-cluster"

rbac:
  create: true

clusterRole: true

# This is the key to allow multiple external-dns instances.
# Only Ingress[Route] resources with this annotation will be targeted by the
# current instance of Helm.
annotationFilter: "external-dns.kubernetes.io/provider=cloudflare"
