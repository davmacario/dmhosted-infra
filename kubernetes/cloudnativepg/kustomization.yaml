apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CNPG is installed via remote manifests, so we use a kustomization to reference
# them; also barman is installed in the same way.
# Both manifests include the `cnpg-system` namespace.
resources:
  # CloudNativePG operator
  # NOTE: renovate uses specific custom manager for this
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.0/cnpg-1.30.0.yaml
  # Barman Cloud CNPG-I plugin
  # renovate: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.0/manifest.yaml
