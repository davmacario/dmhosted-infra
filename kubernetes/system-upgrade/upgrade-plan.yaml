# k3s upgrade Plans for system-upgrade-controller.
#
# `version` is pinned (no `channel`) so that upgrades only happen through a
# reviewed PR (opened by Renovate) followed by a manual Argo CD sync.
# The upgrade image tag is derived from `version` (`+` replaced by `-`).
# Keep `version` equal in both Plans and in `k3s_version`
# (inventory/group_vars/k3s_cluster.yml); Renovate bumps all three together.
#
# Server plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: In
      values:
      - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: ghcr.io/k3s-io/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.37.1+k3s1
---
# Agent plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
  prepare:
    args: # this will cause this plan to wait for the server plan to finish
    - prepare
    - server-plan
    image: ghcr.io/k3s-io/k3s-upgrade
  serviceAccountName: system-upgrade
  upgrade:
    image: ghcr.io/k3s-io/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.37.1+k3s1
