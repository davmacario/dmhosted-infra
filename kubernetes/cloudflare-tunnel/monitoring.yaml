apiVersion: v1
kind: Service
metadata:
  name: cloudflare-metrics
  namespace: cloudflare
  labels:
    app: cloudflared
    tunnel-name: k3s-traefik
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics # From deployment
      protocol: TCP
  selector:
    pod: cloudflared
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflared-servicemonitor
  namespace: cloudflare
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: cloudflared
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  targetLabels: # Propagate labels from target Service
    - app
    - tunnel-name
