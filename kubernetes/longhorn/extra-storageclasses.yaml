apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-data-local
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "3"
  dataLocality: best-effort
  disableRevisionCounter: "true"
  fsType: ext4
  staleReplicaTimeout: "2880"
  fromBackup: ""
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-no-retain
provisioner: driver.longhorn.io
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "3"
  dataLocality: disabled
  disableRevisionCounter: "true"
  fsType: ext4
  staleReplicaTimeout: "2880"
  fromBackup: ""
---
# Example usage: DBs (managed with CNPG), where we need:
# 1. Single volume copy (replication managed by Operator)
# 2. Strict-local policy (high performance)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-singlecopy
provisioner: driver.longhorn.io
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  dataLocality: strict-local
  disableRevisionCounter: "true"
  fsType: ext4
  staleReplicaTimeout: "2880"
  fromBackup: ""
---
# ReadWriteMany storageclass
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rwx
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "2880"
  migratable: "false" # This is key!
  fsType: "ext4"
  nfsOptions: "vers=4.2,noresvport,softerr,timeo=600,retrans=5"
