---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-ingressroute-certificate-internal
  namespace: nginx
spec:
  # This is the name of the Kube secret where the cert will be stored
  secretName: nginx-certificate-secret-prod-internal
  issuerRef: # Reference cluster issuer
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - nginx.internal.dmhosted.com
