# Scraping other Tailscale nodes (always on)
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: external-node-exporters
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  # Must differ from the in-cluster `node-exporter` job: the kube-prometheus
  # recording rules select job="node-exporter", so sharing it would mix these
  # hosts into the cluster-wide CPU/memory figures
  jobName: node-exporter-external
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets: ["100.68.161.46:9100"]
      labels:
        instance: puppydm01
    - targets: ["100.103.170.65:9100"]
      labels:
        instance: davipi2
    - targets: ["100.87.33.76:9100"]
      labels:
        instance: beta2
    - targets: ["100.91.137.78:9100"]
      labels:
        instance: hw2482
