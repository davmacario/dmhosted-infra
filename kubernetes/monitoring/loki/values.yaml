# $schema: https://raw.githubusercontent.com/grafana-community/helm-charts/refs/heads/main/charts/loki/values.schema.json
# Helm values for loki (oci://ghcr.io/grafana-community/helm-charts/loki)

# Deploy in Monolithic (former 'SingleBinary') mode
# All the stack in a single binary
deploymentMode: Monolithic

commonLabels:
  workload: monitoring
  app: loki

loki:
  auth_enabled: false
  commonConfig:
    # Required in Monolithic mode
    replication_factor: 1
  storage: # configure **current** storage backend (see schemaConfig.configs)
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    s3:
      endpoint: rustfs.internal.dmhosted.com
      region: eu-west-1
      s3ForcePathStyle: true
      insecure: false
      # Expanded by Loki - variables are mounted as secret
      # See https://grafana.com/docs/loki/latest/configure/#use-environment-variables-in-the-configuration
      secretAccessKey: "${S3_ACCESS_SECRET_KEY}"
      accessKeyId: "${S3_ACCESS_KEY_ID}"
  schemaConfig:
    # 'configs' is used to set the specific schema, object store and index of
    # colleced logs, starting from a specified date/timestamp in the collected
    # logs.
    # This allows to update the schema by adding an extra entry that will take
    # over from 'from'
    configs:
      - from: "2024-04-01" # from logs - can put whatever date from current day on
        store: tsdb
        object_store: s3 # must match loki.storage.type
        schema: v13
        index:
          prefix: loki_index_ # object key prefix for index file
          period: 24h # use one index table (i.e., file) per 'period' of data
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h # 7 days
    reject_old_samples_max_age: 168h
    reject_old_samples: true

  rulerConfig:
    enable_api: true

  structuredConfig:
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3

singleBinary:
  replicas: 1
  kind: StatefulSet
  deploymentStrategy: # since persistence is enabled and selected SC does not do RWX
    type: Recreate
    rollingUpdate: null
  extraEnvFrom:
    - secretRef:
        name: loki-s3
  # Configure "cache" volume, not bulk storage (for which we have s3)
  # According to Claude, used for WAL, compactor, and tsdb shipper cache (?)
  persistence:
    whenScaled: Delete
    whenDeleted: Delete
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    storageClass: longhorn-singlecopy
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The memberlist service is headless; without this its DNS name does not resolve
# until the pod is Ready, and the pod cannot become Ready until it joins the
# ring -> ~90s of "failed to resolve loki-memberlist..." warnings at startup.
memberlist:
  service:
    publishNotReadyAddresses: true

# TODO: only allow reaching Loki from Grafana
# networkPolicy:

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-stack

# deactivate unused components (running in Monolithic mode)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
