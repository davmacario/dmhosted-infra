apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ziggo-router
  namespace: networking
  labels:
    kubernetes.io/service-name: ziggo-router # Required to link the Service
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.178.1 # Internal static IP of router
ports:
  - name: http
    port: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ziggo-router
  namespace: networking
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ziggo-router
  namespace: networking
spec:
  ingressClassName: traefik-tailscale
  entryPoints:
    - websecure
  routes:
    - match: Host(`router.internal.dmhosted.com`)
      kind: Rule
      services:
        - name: ziggo-router
          port: http
  tls:
    secretName: ziggo-router-internal-certificate
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ziggo-router-internal-certificate
  namespace: networking
spec:
  secretName: ziggo-router-internal-certificate
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - router.internal.dmhosted.com
