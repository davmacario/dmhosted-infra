---
# Renovate global configuration.
# Repository-level configuration lives in /renovate.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-env
  namespace: renovate
data:
  RENOVATE_PLATFORM: github
  RENOVATE_REPOSITORIES: davmacario/dmhosted-infra
  RENOVATE_ONBOARDING: "false"
  RENOVATE_REQUIRE_CONFIG: required
  # Commit through the GitHub API so commits are signed/verified as the App
  RENOVATE_PLATFORM_COMMIT: enabled
  RENOVATE_USERNAME: dmhosted-renovate[bot]
  RENOVATE_GIT_AUTHOR: dmhosted-renovate[bot] <341583265+dmhosted-renovate[bot]@users.noreply.github.com>
  RENOVATE_BASE_DIR: /tmp/renovate
  LOG_LEVEL: info
