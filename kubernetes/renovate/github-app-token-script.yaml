---
# Exchanges the GitHub App private key for a short-lived (1h) installation
# token, written to /token/token for the Renovate container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-app-token-script
  namespace: renovate
data:
  github-app-token.mjs: |
    import crypto from "node:crypto";
    import fs from "node:fs";

    const appId = process.env.GITHUB_APP_ID;
    const privateKey = fs.readFileSync("/github-app/private-key.pem", "utf8");
    const repository = process.env.RENOVATE_REPOSITORIES.split(",")[0];

    const b64 = (obj) => Buffer.from(JSON.stringify(obj)).toString("base64url");
    const now = Math.floor(Date.now() / 1000);
    const unsigned = `${b64({ alg: "RS256", typ: "JWT" })}.${b64({ iat: now - 60, exp: now + 540, iss: appId })}`;
    const signature = crypto.sign("RSA-SHA256", Buffer.from(unsigned), privateKey).toString("base64url");

    const headers = {
      Authorization: `Bearer ${unsigned}.${signature}`,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    };

    async function call(url, init = {}) {
      const res = await fetch(url, { headers, ...init });
      if (!res.ok) {
        throw new Error(`${init.method ?? "GET"} ${url} -> ${res.status}: ${await res.text()}`);
      }
      return res.json();
    }

    const installation = await call(`https://api.github.com/repos/${repository}/installation`);
    const { token } = await call(
      `https://api.github.com/app/installations/${installation.id}/access_tokens`,
      { method: "POST" },
    );
    fs.writeFileSync("/token/token", token, { mode: 0o600 });
    console.log(`Obtained installation token for ${repository}`);
